<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E1F1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="구종 카드">
<title>구종 카드</title>
<style>
:root{
  --pine:#0E1F1C;--card:#16302B;--card2:#1D3B35;--line:#2B534B;
  --chalk:#E4EDE8;--dim:#7E9A94;--amber:#E9B44C;--ice:#7FD1E8;--clay:#D8593F;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pine);color:var(--chalk);font-family:var(--sans);font-size:15px;
  line-height:1.4;padding:env(safe-area-inset-top) 0 calc(58px + env(safe-area-inset-bottom))}
.wrap{max-width:520px;margin:0 auto;padding:0 12px}
header{display:flex;align-items:baseline;justify-content:space-between;padding:11px 0 8px}
.logo{font-size:18px;font-weight:800;letter-spacing:-.02em}
.meta{font-family:var(--mono);font-size:10px;color:var(--dim)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:9px}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;color:var(--dim);
  text-transform:uppercase;margin-bottom:8px}

/* ---- 입력: 한 줄에 라벨 + 동그라미 ---- */
.row{display:flex;align-items:center;gap:7px;min-height:32px}
.row + .row{margin-top:5px}
.rl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--dim);
  width:34px;flex:0 0 34px}
.dots{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.d{width:27px;height:27px;border-radius:50%;border:1.5px solid var(--line);background:transparent;
  color:var(--dim);font-family:var(--mono);font-size:11.5px;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .1s,color .1s,border-color .1s}
.d.on{background:var(--card2);border-color:var(--chalk);color:var(--chalk)}
.d.lamp.on{background:var(--amber);border-color:var(--amber);color:var(--pine)}
.d.lamp.s.on{background:var(--clay);border-color:var(--clay);color:#fff}
.d.lamp.o.on{background:var(--chalk);border-color:var(--chalk);color:var(--pine)}
.d.wide{width:auto;border-radius:14px;padding:0 11px;font-family:var(--sans);
  font-size:12px;font-weight:600}
.d:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.gap{width:9px;flex:0 0 9px}

/* ---- 결과 상단 띠 ---- */
.band{display:flex;height:40px;border-radius:7px;overflow:hidden;margin-bottom:4px}
.bs{display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;color:var(--pine);min-width:0;overflow:hidden}
.bs em{font-style:normal;font-size:8.5px;font-family:var(--sans);font-weight:700;
  white-space:nowrap;opacity:.75}
.bleg{display:flex;flex-wrap:wrap;gap:2px 12px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.bleg span{display:inline-flex;align-items:center;gap:4px}
.bleg i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:0 0 9px}
.bleg b{color:var(--chalk);font-weight:400}
.src{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:7px;line-height:1.5}

/* ---- 존 카드 ---- */
.zw{position:relative;padding:26px 34px 26px;margin:0 auto;max-width:250px}
.zg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border:1.5px solid var(--chalk);padding:2px}
.zc{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:14px;border:0;cursor:pointer;color:var(--chalk);padding:0}
.zc small{font-size:8px;color:var(--dim)}
.zc.sel{outline:2px solid var(--ice);outline-offset:-2px}
.zo{position:absolute;width:32px;text-align:center;font-family:var(--mono);font-size:12px;
  color:var(--dim);border:0;background:transparent;cursor:pointer;padding:1px}
.zo.sel{color:var(--ice)}
.zo.a{top:0;left:0}.zo.b{top:0;right:0}.zo.c{bottom:0;left:0}.zo.d2{bottom:0;right:0}
.zlab{position:absolute;font-family:var(--mono);font-size:9px;color:var(--dim)}
.zlab.in{top:50%;left:2px;transform:translateY(-50%)}
.zlab.out{top:50%;right:2px;transform:translateY(-50%)}
.zd{font-family:var(--mono);font-size:11.5px;color:var(--chalk);margin-top:6px;
  padding-top:7px;border-top:1px solid var(--line);min-height:16px;text-align:center}

table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
th{font-family:var(--sans);font-size:9.5px;font-weight:600;color:var(--dim);text-align:right;
  padding:0 0 5px;border-bottom:1px solid var(--line)}
th:first-child{text-align:left}
td{padding:4px 0;text-align:right;border-bottom:1px solid rgba(43,83,75,.4)}
td:first-child{text-align:left;font-family:var(--sans);font-size:12px;font-weight:600}
tr.thin td{color:var(--dim)}
.best{color:var(--amber);font-weight:700}
.worst{color:var(--ice)}
.verdict{margin-top:8px;padding:9px;background:var(--card2);border-radius:7px;font-size:13px;font-weight:600}
.verdict span{color:var(--amber)}
.note{font-size:11px;color:var(--dim);margin-top:7px;line-height:1.5}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(14,31,28,.96);
  border-top:1px solid var(--line);backdrop-filter:blur(8px);
  padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;background:transparent;border:0;color:var(--dim);font-family:var(--sans);
  font-size:11.5px;font-weight:600;padding:12px 0 11px;cursor:pointer}
nav button.on{color:var(--amber);box-shadow:inset 0 2px 0 var(--amber)}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">구종 카드</div><div class="meta" id="meta"></div></header>

<section id="v-count">
  <div class="panel">
    <div class="row"><span class="rl">이닝</span><span class="dots" id="ib"></span></div>
    <div class="row"><span class="rl">투수</span><span class="dots" id="pt"></span>
      <span class="gap"></span><span class="rl">타자</span><span class="dots" id="st"></span></div>
    <div class="row"><span class="rl">볼</span><span class="dots" id="balls"></span>
      <span class="gap"></span><span class="rl">스트</span><span class="dots" id="strikes"></span>
      <span class="gap"></span><span class="rl">아웃</span><span class="dots" id="outsl"></span></div>
    <div class="row"><span class="rl">주자</span><span class="dots" id="bs"></span></div>
  </div>

  <div class="panel">
    <div class="band" id="band"></div>
    <div class="bleg" id="bleg"></div>
    <div class="src" id="src"></div>
  </div>

  <div class="panel">
    <div class="eyebrow">어디로 — 포수 시점</div>
    <div class="zw" id="zw"></div>
    <div class="zd" id="zd">구역을 누르면 결과가 나옵니다</div>
  </div>

  <div class="panel">
    <div class="eyebrow">무엇이 먹히나</div>
    <div id="res"></div>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="panel">
    <div class="eyebrow">타자는</div>
    <div id="bat"></div>
  </div>
</section>

<section id="v-base" class="hidden">
  <div class="panel">
    <div class="row"><span class="rl">주자</span><span class="dots" id="base2"></span></div>
    <div class="row"><span class="rl">아웃</span><span class="dots" id="outs2"></span>
      <span class="gap"></span><span class="rl">이닝</span><span class="dots" id="ib2"></span></div>
    <div class="note">카운트를 빼고 실측 그대로 봅니다. 보정이 없습니다.</div>
  </div>
  <div class="panel"><div class="band" id="boband"></div><div class="bleg" id="bobleg"></div>
    <div class="src" id="bonote"></div></div>
  <div class="panel"><div class="eyebrow">결과</div><div id="bores"></div></div>
</section>

<section id="v-seq" class="hidden">
  <div class="panel">
    <div class="row"><span class="rl">직전</span><span class="dots" id="prev"></span></div>
    <div class="row"><span class="rl">결과</span><span class="dots" id="pg"></span></div>
    <div class="note" id="seqhead"></div>
  </div>
  <div class="panel">
    <div class="band" id="sqband"></div><div class="bleg" id="sqbleg"></div>
    <div class="src" id="sqsrc"></div>
  </div>
  <div class="panel">
    <div class="eyebrow">다음 공 결과</div>
    <div id="seqtab"></div>
  </div>
</section>

<section id="v-etc" class="hidden">
  <div class="panel"><div class="eyebrow">대타 vs 일반</div><div id="phtab"></div>
    <div class="note">대타 = 6회 이후 그 경기 첫 타석.</div></div>
  <div class="panel"><div class="eyebrow">이닝대별 배합</div><div id="inntab"></div></div>
  <div class="panel"><div class="eyebrow">타순 회차별 배합</div><div id="ordtab"></div></div>
  <div class="panel"><div class="eyebrow">리그 전체</div><div id="alltab"></div></div>
</section>
</div>

<nav>
  <button data-v="count" class="on">카운트</button>
  <button data-v="base">상황</button>
  <button data-v="seq">시퀀스</button>
  <button data-v="etc">기타</button>
</nav>

const T={};["mix","zone","batter","result","loc","seq2","baseout","ph","inning","order","all","s_inn","s_out","s_base"].forEach(n=>T[n]=idx(n));

const $=id=>document.getElementById(id);
const pct=v=>v==null?"–":Math.round(v);
const ba3=v=>v==null?"–":v.toFixed(3).slice(1);

function dots(el,opts,isOn,onTap,cls){
  el.innerHTML="";
  opts.forEach(([v,label,extra])=>{
    const b=document.createElement("button");
    b.className="d "+(cls||"")+(extra||"")+(isOn(v)?" on":"");
    b.textContent=label; b.onclick=()=>{onTap(v);render();};
    el.appendChild(b);
  });
}
function lampRow(el,n,on,cls,set){
  el.innerHTML="";
  for(let i=1;i<=n;i++){
    const b=document.createElement("button");
    b.className="d lamp "+cls+(i<=on?" on":"");
    b.setAttribute("aria-label",i+cls);
    b.onclick=()=>{set(on===i?i-1:i);render();};
    el.appendChild(b);
  }
}
function baseKey(){ return (S.b2||S.b3)?"risp":(S.b1?"first":(S.b1||S.b2||S.b3?"x":"none")); }
function baseAny(){ return S.b1||S.b2||S.b3; }

function band(elB,elL,rows,key){
  const tot=rows.reduce((a,r)=>a+r.n,0);
  const sorted=rows.slice().sort((a,b)=>b.n-a.n);
  elB.innerHTML=sorted.map(r=>{
    const p=r.n/tot*100;
    return `<div class="bs" style="width:${p}%;background:${COL[r[key]]||"#888"}">
      ${p>=6?Math.round(p):""}${p>=9?`<em>${KO[r[key]]||r[key]}</em>`:""}</div>`;}).join("");
  elL.innerHTML=sorted.map(r=>`<span><i style="background:${COL[r[key]]||"#888"}"></i>${KO[r[key]]||r[key]} <b>${Math.round(r.n/tot*100)}</b></span>`).join("");
}

function resultTable(el,rows,key){
  const sorted=rows.slice().sort((a,b)=>(b.csw??0)-(a.csw??0));
  const cs=sorted.map(r=>r.csw).filter(v=>v!=null),hi=Math.max(...cs),lo=Math.min(...cs);
  el.innerHTML=`<table><thead><tr><th>구종</th><th>구수</th><th>구속</th><th>루킹</th><th>헛스윙</th><th>CSW</th><th>타율</th></tr></thead><tbody>`+
    sorted.map(r=>`<tr class="${r.n<100?"thin":""}"><td>${KO[r[key]]||r[key]}</td><td>${r.n}</td>
      <td>${r.mph==null?"–":Math.round(r.mph)}</td><td>${pct(r.cs)}</td><td>${pct(r.wh)}</td>
      <td class="${r.csw===hi?"best":r.csw===lo?"worst":""}">${pct(r.csw)}</td>
      <td>${ba3(r.ba)}</td></tr>`).join("")+`</tbody></table>`;
  return sorted;
}

function zoneCard(rows){
  const map={},tot=rows.reduce((a,r)=>a+r.n,0);
  rows.forEach(r=>map[r.zone]=r);
  const pv=z=>map[z]?map[z].n/tot*100:0;
  const inner=[1,2,3,4,5,6,7,8,9].map(z=>{
    const p=pv(z),a=Math.min(.08+p/9*.6,.72);
    return `<button class="zc ${S.zone===z?"sel":""}" data-z="${z}"
      style="background:rgba(233,180,76,${a.toFixed(2)})">${Math.round(p)}<small>${z}</small></button>`;}).join("");
  const cls={11:"a",12:"b",13:"c",14:"d2"};
  const out=[11,12,13,14].map(z=>`<button class="zo ${cls[z]} ${S.zone===z?"sel":""}" data-z="${z}">${Math.round(pv(z))}</button>`).join("");
  $("zw").innerHTML=out+`<span class="zlab in">안</span><span class="zlab out">밖</span><div class="zg">${inner}</div>`;
  $("zw").querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{
    const z=+b.dataset.z;S.zone=S.zone===z?null:z;render();});
  if(S.zone!=null&&map[S.zone]){const r=map[S.zone];

}

  lampRow($("outsl"),2,S.o,"o",v=>S.o=v);
  dots($("bs"),[[1,"1루"],[2,"2루"],[3,"3루"]],
    v=>({1:S.b1,2:S.b2,3:S.b3})[v],
    v=>{if(v===1)S.b1=!S.b1;if(v===2)S.b2=!S.b2;if(v===3)S.b3=!S.b3;},"wide ");

  const cnt=S.b+"-"+S.s,f={cnt:cnt,p_throws:S.p,stand:S.st};

  const factor=(tbl,val)=>{
    if(val==null)return null;
    const t=T[tbl],ci=t.c,all=t.rows.filter(r=>r[ci.cnt]===cnt);
    if(!all.length)return null;
    const sel=all.filter(r=>String(r[ci.k])===String(val));
    const sum=rs=>{const a={};let s=0;rs.forEach(r=>{a[r[ci.pitch_type]]=(a[r[ci.pitch_type]]||0)+r[ci.n];s+=r[ci.n];});return{a:a,s:s};};
    const A=sum(all),B=sum(sel);
    if(B.s<250)return{weak:true};
    const o={};Object.keys(A.a).forEach(k=>o[k]=(B.a[k]!=null&&A.a[k])?(B.a[k]/B.s)/(A.a[k]/A.s):1);
    return{f:o,n:B.s};
  };
  const F=[factor("s_inn",S.ib==="*"?null:S.ib),
           factor("s_out",S.o>0?S.o:null),
           factor("s_base",baseAny()?baseKey():null)];

  const baseRows=q("mix",f);
  let acc=null,tot=0,weak=false,adjN=[];
  if(baseRows.length){
    let s2=0;const bn={};baseRows.forEach(r=>{bn[r.pitch_type]=r.n;s2+=r.n;});
    tot=s2;acc={};Object.keys(bn).forEach(k=>acc[k]=bn[k]/s2);
    F.forEach(x=>{if(!x)return;if(x.weak){weak=true;return;}
      adjN.push(x.n);Object.keys(acc).forEach(k=>acc[k]*=(x.f[k]!=null?x.f[k]:1));});
    const z=Object.values(acc).reduce((a,b)=>a+b,0);Object.keys(acc).forEach(k=>acc[k]/=z);
  }
  if(acc){
    band($("band"),$("bleg"),Object.entries(acc).map(([p,v])=>({pitch_type:p,n:v})),"pitch_type");
    const L=[];
    if(S.ib!=="*")L.push(S.ib==="9"?"9회+":S.ib+"회");
    L.push((S.p==="R"?"우투":"좌투")+(S.st==="R"?" 우타":" 좌타"));
    L.push(`${S.b}−${S.s} · ${S.o}아웃`);
    if(baseAny())L.push([S.b1?"1":"",S.b2?"2":"",S.b3?"3":""].filter(Boolean).join("·")+"루");
    let n=L.join(" · ")+`  |  기준 ${tot.toLocaleString()}구`;
    if(adjN.length)n+=` · 보정 ${Math.min.apply(null,adjN).toLocaleString()}구`;
    if(weak)n+="  일부 조건은 표본 부족으로 미반영";
    $("src").textContent=n;
  } else {$("band").innerHTML="";$("bleg").innerHTML="";$("src").textContent="표본 없음";}

  const zr=q("zone",f);
  if(zr.length)zoneCard(zr);else{$("zw").innerHTML="";$("zd").textContent="표본 없음";}

  const res=q("result",{cnt:cnt});
  if(res.length){
    const so=resultTable($("res"),res,"pitch_type").filter(r=>r.n>=100);
    $("verdict").innerHTML=so.length?`→ <span>${KO[so[0].pitch_type]}</span>${so.length>1?` · ${KO[so[so.length-1].pitch_type]}는 피할 것`:""}`:"";
  } else {$("res").innerHTML="";$("verdict").textContent="";}

  const b=q("batter",f)[0];
  $("bat").innerHTML=b?`<table><tbody>
    <tr><td>스윙</td><td>${pct(b.sw)}</td><td>존 안</td><td>${pct(b.izsw)}</td><td>존 밖</td><td>${pct(b.ozsw)}</td></tr>
    <tr><td>헛스윙</td><td>${pct(b.wh)}</td><td>타율</td><td>${ba3(b.ba)}</td><td>배럴</td><td>${pct(b.brl)}</td></tr>
    </tbody></table>`:"<div class='note'>표본 없음</div>";

  /* 상황 탭 */
  dots($("base2"),[["none","없음"],["first","1루"],["risp","득점권"]],v=>S.base===v,v=>S.base=v,"wide ");
  dots($("outs2"),[[0,"0"],[1,"1"],[2,"2"]],v=>S.outs2===v,v=>S.outs2=v);
  dots($("ib2"),[["1-3","1~3"],["4-6","4~6"],["7-8","7~8"],["9+","9+"]],v=>S.ib2===v,v=>S.ib2=v,"wide ");
  const bo=q("baseout",{base:S.base,outs_when_up:S.outs2,ib:S.ib2});
  if(bo.length){band($("boband"),$("bobleg"),bo,"pitch_type");
    $("bonote").textContent=`${bo.reduce((a,r)=>a+r.n,0).toLocaleString()}구 · 실측`;
    resultTable($("bores"),bo,"pitch_type");}
  else{$("boband").innerHTML="";$("bobleg").innerHTML="";$("bonote").textContent="표본 없음";$("bores").innerHTML="";}

  /* 시퀀스 */
  dots($("prev"),ORDER.map(p=>[p,KO[p]]),v=>S.prev===v,v=>S.prev=v,"wide ");
  dots($("pg"),[["S","스트라이크"],["B","볼"]],v=>S.pg===v,v=>S.pg=v,"wide ");
  const sq=q("seq2",{cnt:cnt,pg:S.pg,prev:S.prev});
  $("seqhead").textContent=`${cnt.replace("-","−")} 카운트 · 직전 ${KO[S.prev]} → ${S.pg==="S"?"스트라이크":"볼"}`;
  if(sq.length){
    band($("sqband"),$("sqbleg"),sq,"pitch");
    $("sqsrc").textContent=`${sq.reduce((a,r)=>a+r.n,0).toLocaleString()}구 · 실측`;
    const so=sq.slice().sort((a,b)=>b.n-a.n);
    $("seqtab").innerHTML=`<table><thead><tr><th>다음 공</th><th>구수</th><th>비율</th><th>구속</th><th>헛스윙</th><th>CSW</th><th>타율</th></tr></thead><tbody>`+
      (()=>{const tt=sq.reduce((a,r)=>a+r.n,0);
        return so.map(r=>`<tr class="${r.n<100?"thin":""}"><td>${KO[r.pitch]}</td><td>${r.n}</td>
          <td>${Math.round(r.n/tt*100)}</td><td>${r.mph==null?"–":Math.round(r.mph)}</td>
          <td>${pct(r.wh)}</td><td>${pct(r.csw)}</td><td>${ba3(r.ba)}</td></tr>`).join("");})()+
      `</tbody></table>`;
  } else {$("sqband").innerHTML="";$("sqbleg").innerHTML="";$("sqsrc").textContent="표본 없음";$("seqtab").innerHTML="";}

  /* 기타 */
  const ph=q("ph",{}),gp=k=>ph.filter(r=>r.ph===k),sm=a=>a.reduce((x,r)=>x+r.n,0);
  const wa=(a,k)=>{const v=a.filter(r=>r[k]!=null);if(!v.length)return null;
    return v.reduce((x,r)=>x+r[k]*r.n,0)/v.reduce((x,r)=>x+r.n,0);};
  const A=gp("ph"),B=gp("reg");
  $("phtab").innerHTML=`<table><thead><tr><th></th><th>구수</th><th>스윙</th><th>헛스윙</th><th>CSW</th><th>타율</th></tr></thead><tbody>
    <tr><td>대타</td><td>${sm(A)}</td><td>${pct(wa(A,"sw"))}</td><td>${pct(wa(A,"wh"))}</td><td>${pct(wa(A,"csw"))}</td><td>${ba3(wa(A,"ba"))}</td></tr>
    <tr><td>일반</td><td>${sm(B)}</td><td>${pct(wa(B,"sw"))}</td><td>${pct(wa(B,"wh"))}</td><td>${pct(wa(B,"csw"))}</td><td>${ba3(wa(B,"ba"))}</td></tr>
    </tbody></table>`;
  const grid=(el,rows,gk,lab)=>{
    const gs=[...new Set(rows.map(r=>r[gk]))];
    el.innerHTML=`<table><thead><tr><th>구종</th>`+gs.map(g=>`<th>${lab[g]||g}</th>`).join("")+`</tr></thead><tbody>`+
      ORDER.map(p=>`<tr><td>${KO[p]}</td>`+gs.map(g=>{
        const sub=rows.filter(r=>r[gk]===g),tt=sub.reduce((a,r)=>a+r.n,0),r=sub.find(r=>r.pitch_type===p);
        return `<td>${r?Math.round(r.n/tt*100):"–"}</td>`;}).join("")+`</tr>`).join("")+`</tbody></table>`;};
  grid($("inntab"),q("inning",{}),"ib",{"1-3":"1~3","4-6":"4~6","7-8":"7~8","9+":"9+"});
  grid($("ordtab"),q("order",{}),"n_thruorder_pitcher",{1:"1순",2:"2순",3:"3순"});
  resultTable($("alltab"),q("all",{}),"pitch_type");
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  ["count","base","seq","etc"].forEach(v=>$("v-"+v).classList.toggle("hidden",v!==b.dataset.v));
  window.scrollTo(0,0);});
render();
</script>
</body>
</html>
